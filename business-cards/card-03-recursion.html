<!-- fragment shader: recursive orbit-fold IFS, acid->lime depth bands on ink -->
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 r; uniform float t;
void main(){
  vec2 uv = (gl_FragCoord.xy - .5*r)/r.y;
  vec2 p = uv*1.25;
  float a = t*.07;
  mat2 R = mat2(cos(a),-sin(a),sin(a),cos(a));
  vec3 ink = vec3(.039,.039,.031), acid = vec3(.89,.294,.184), lime = vec3(.78,1.,.208);
  vec3 col = ink;
  for (int i = 0; i < 9; i++) {
    p = abs(R*p) - vec2(.42,.24);
    float d = abs(length(p) - .35);
    float f = float(i)/9.;
    col = mix(col, mix(acid, lime, f), smoothstep(.035,.005,d) * (.22 + .55*f));
  }
  col *= 1. - dot(uv*.8, uv*.8);
  gl_FragColor = vec4(col, 1.);
}
</script>
<script>
/* minimal raw-WebGL fullscreen-quad driver; falls back to .static-bg */
(function(){
  var c = document.getElementById('gl');
  var gl = c.getContext('webgl', { antialias: true });
  if (!gl) { document.body.classList.add('no-webgl'); return; }
  function sh(type, src){ var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  var p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { document.body.classList.add('no-webgl'); return; }
  gl.useProgram(p);
  var b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var a = gl.getAttribLocation(p, 'a');
  gl.enableVertexAttribArray(a);
  gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  var uR = gl.getUniformLocation(p, 'r'), uT = gl.getUniformLocation(p, 't');
  function rs(){
    c.width = c.clientWidth * (window.devicePixelRatio || 1);
    c.height = c.clientHeight * (window.devicePixelRatio || 1);
    gl.viewport(0, 0, c.width, c.height);
    gl.uniform2f(uR, c.width, c.height);
  }
  window.addEventListener('resize', rs); rs();
  (function frame(ms){ gl.uniform1f(uT, ms*.001); gl.drawArrays(gl.TRIANGLES, 0, 3); requestAnimationFrame(frame); })(0);
})();
</script>
